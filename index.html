<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DeepSeek 爆裂求生</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#000;overflow:hidden;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:#8ea7c6;
    -webkit-tap-highlight-color:transparent;
  }
  #c{display:block;width:100vw;height:100vh;cursor:none}   /* 始终隐藏系统光标 */
  /* 屏幕震动施加在这个容器上：画布、暗角、提示一起动，否则静止的图层会互相抵消 */
  #shake{position:fixed;inset:0;will-change:transform}

  .vig{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(120% 90% at 50% 45%,transparent 40%,rgba(0,0,0,.55) 100%);
  }
  /* 玩法介绍：占据屏幕下 1/3，字号放大并带荧光 */
  .hint{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:10;
    pointer-events:none;text-align:center;user-select:none;
    width:min(92vw,900px);height:33.4vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    padding:0 24px;box-sizing:border-box;
    animation:glowPulse 3.6s ease-in-out infinite;
  }
  .hint b{
    display:block;font-weight:700;color:#eaf2ff;
    font-size:clamp(22px,3.4vw,38px);letter-spacing:.10em;line-height:1.3;
    text-shadow:0 0 12px rgba(120,170,255,.95),0 0 34px rgba(77,107,254,.85),0 0 70px rgba(60,90,255,.5);
  }
  .hint em{
    display:block;font-style:normal;color:#c2d8f5;
    font-size:clamp(15px,1.6vw,21px);letter-spacing:.10em;line-height:2;
    text-shadow:0 0 10px rgba(90,140,255,.85),0 0 26px rgba(60,100,240,.55);
  }
  .hint i{
    font-style:normal;font-weight:700;color:#ffffff;
    text-shadow:0 0 14px rgba(140,190,255,1),0 0 32px rgba(77,150,255,.9);
  }
  .hint.hidden{opacity:0;visibility:hidden;transition:opacity .3s}
  @keyframes glowPulse{
    0%,100%{opacity:.88;filter:brightness(1)}
    50%{opacity:1;filter:brightness(1.18)}
  }

  /* ================= 结束界面 + 排行榜 ================= */
  #over{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:20;display:none;flex-direction:column;gap:9px;
    width:min(92vw,420px);max-height:88vh;overflow:hidden;
    padding:16px 16px 12px;border-radius:14px;box-sizing:border-box;
    background:rgba(8,12,22,.93);border:1px solid rgba(90,130,220,.45);
    box-shadow:0 0 40px rgba(40,80,200,.35);
    text-align:center;touch-action:auto;font-size:13px;color:#c2d8f5;
  }
  #over.show{display:flex}
  #over h2{margin:0;font-size:clamp(20px,3vw,26px);letter-spacing:.10em;color:#eaf2ff;
           text-shadow:0 0 14px rgba(120,170,255,.9),0 0 34px rgba(77,107,254,.7)}
  #over .stat{font-size:clamp(13px,1.6vw,16px);letter-spacing:.08em;color:#c2d8f5}
  #over .stat i{font-style:normal;font-weight:700;color:#fff;text-shadow:0 0 12px rgba(120,170,255,.9)}
  #over .subrow{display:flex;gap:8px}
  #pname{
    flex:1;min-width:0;padding:9px 10px;border-radius:8px;
    border:1px solid rgba(90,130,220,.5);background:rgba(16,22,38,.9);
    color:#eaf2ff;font:inherit;text-align:center;
    user-select:text;-webkit-user-select:text;
  }
  #pname::placeholder{color:#5f7291}
  #submitBtn{
    padding:9px 13px;border:0;border-radius:8px;background:#2b5fd9;color:#fff;
    font:inherit;font-weight:700;white-space:nowrap;cursor:pointer;
  }
  #submitBtn:disabled{opacity:.5}
  #submsg{min-height:17px;font-size:12px;color:#8fa8c8}
  #submsg.ok{color:#5fd07a}
  #submsg.bad{color:#ff8f8f}
  #boardWrap{
    flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    border-top:1px solid rgba(90,130,220,.25);padding-top:8px;text-align:left;
  }
  #boardList{list-style:none;margin:0;padding:0}
  #boardList li{display:flex;gap:8px;align-items:baseline;padding:3px 4px;border-radius:6px;
                font-size:12.5px;color:#b9cbe4}
  #boardList li .rk{width:2.1em;flex:none;text-align:right;color:#7d92b3}
  #boardList li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dce8ff}
  #boardList li .sc{flex:none;color:#a9c3e8}
  #boardList li.me{background:rgba(50,90,200,.30);box-shadow:inset 0 0 0 1px rgba(120,160,255,.45)}
  #boardList li.me .nm{color:#fff;font-weight:700}
  #myrank{font-size:12.5px;color:#9fb6d6}
  #again{font-size:12px;color:#7d92b3}

  #hud{
    position:fixed;left:26px;top:22px;z-index:11;display:flex;gap:26px;
    font-size:15px;letter-spacing:.10em;color:#b9cbe4;pointer-events:none;user-select:none;
    text-shadow:0 0 14px rgba(0,0,0,.95),0 1px 3px rgba(0,0,0,.9);
  }
  #hud b{
    color:#ffffff;font-weight:700;font-size:18px;letter-spacing:.04em;
    text-shadow:0 0 18px rgba(90,140,255,.75),0 0 6px rgba(0,0,0,.9);
  }
  #hud.hidden{display:none}

  /* ================= 移动端适配 ================= */
  body{touch-action:none;overscroll-behavior:none}          /* 禁止页面滚动/缩放 */
  #boomBtn{
    --bx:0px;--by:0px;                 /* 摆放位置；和按下缩放分开，按下时按钮不会跳位 */
    position:fixed;z-index:12;display:none;
    width:88px;height:88px;border-radius:50%;
    align-items:center;justify-content:center;
    font-size:16px;font-weight:700;letter-spacing:.10em;
    color:#cfe0ff;background:rgba(18,28,50,.86);      /* 未蓄满也是“亮着的按钮”，不显得不可用 */
    border:2px solid rgba(120,160,230,.62);
    box-shadow:0 0 14px rgba(60,100,220,.35),inset 0 0 14px rgba(90,140,255,.18);
    pointer-events:none;user-select:none;-webkit-user-select:none;
    transform:translate(var(--bx),var(--by));
    transition:color .18s,background .18s,border-color .18s,box-shadow .18s,transform .08s;
  }
  /* 游戏进行中始终可点：未蓄满按下也会被接收，只是不爆炸 */
  #boomBtn.show{display:flex;pointer-events:auto}
  #boomBtn:active{transform:translate(var(--bx),var(--by)) scale(.94)}
  /* 未蓄满按下时的即时反馈：表示“收到了，还在蓄力” */
  #boomBtn.wait{color:#fff;border-color:rgba(160,195,255,.95);background:rgba(26,40,72,.95)}
  /* 蓄满：变亮 + 呼吸光晕 */
  #boomBtn.ready{
    color:#fff;background:rgba(24,44,86,.92);
    border-color:rgba(150,190,255,.95);
    animation:boomPulse 1.1s ease-in-out infinite;
  }
  @keyframes boomPulse{
    0%,100%{box-shadow:0 0 20px rgba(77,140,255,.7),0 0 46px rgba(60,110,255,.35),inset 0 0 18px rgba(120,170,255,.35)}
    50%{box-shadow:0 0 34px rgba(77,140,255,1),0 0 76px rgba(60,110,255,.6),inset 0 0 26px rgba(120,170,255,.55)}
  }
  /* 竖屏：底部正中 */
  @media (orientation:portrait){
    #boomBtn{left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));--bx:-50%}
  }
  /* 横屏：左侧正中 */
  @media (orientation:landscape){
    #boomBtn{left:calc(18px + env(safe-area-inset-left,0px));top:50%;--by:-50%}
  }
  /* 移动端：HUD 缩小，避免遮挡 */
  .is-mobile #hud{left:14px;top:12px;gap:12px;font-size:12px;letter-spacing:.06em}
  .is-mobile #hud b{font-size:15px}
  /* 横屏矮屏：介绍压缩，避免溢出 */
  @media (orientation:landscape) and (max-height:620px){
    .hint{height:44vh;gap:6px;padding:0 14px}
    .hint b{font-size:clamp(14px,2.9vh,20px);letter-spacing:.08em}
    .hint em{font-size:clamp(10px,2.0vh,15px);line-height:1.6}
  }
</style>
</head>
<body>
<div id="shake">
  <canvas id="c"></canvas>
  <div class="vig"></div>
  <div id="hint" class="hint"></div>
</div>
<div id="hud" class="hidden"></div>
<div id="over">
  <h2>游戏结束</h2>
  <div class="stat">存活 <i id="ovSurv">0</i> 秒 · 击杀 <i id="ovKills">0</i></div>
  <div class="subrow">
    <input id="pname" maxlength="12" placeholder="输入用户名（≤12 字）" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="submitBtn">提交</button>
  </div>
  <div id="submsg"></div>
  <div id="boardWrap"><ul id="boardList"></ul></div>
  <div id="myrank"></div>
  <div id="again">点击画面 / 空格 重新开始</div>
</div>
<div id="boomBtn">爆炸</div>

  function iconFromPng(dataUrl, size) {
    var c = document.createElement("canvas");
    c.width = size; c.height = size;
    var g = c.getContext("2d");
    var im = new Image();
    im.onload = function () {
      g.clearRect(0, 0, size, size);
      g.drawImage(im, 0, 0, size, size);
      try {
        /* openai.png 是白底黑图（调色板图、无 alpha 通道）：
           按亮度反相 —— 越暗越不透明，并统一涂成白色。
           若只按 alpha 做掩膜，会把整块白底也保留下来。 */
        var id = g.getImageData(0, 0, size, size);
        var d = id.data;
        for (var i = 0; i < d.length; i += 4) {
          if (d[i + 3] === 0) continue;
          var lum = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
          d[i + 3] = Math.round(d[i + 3] * (1 - lum / 255));
          d[i] = d[i + 1] = d[i + 2] = 255;
        }
        g.putImageData(id, 0, 0);
      } catch (e) { /* 跨源限制时保持原图 */ }
    };
    im.onerror = function () {
      g.fillStyle = "#FFFFFF";
      g.beginPath(); g.arc(size / 2, size / 2, size * 0.4, 0, Math.PI * 2); g.fill();
    };
    im.src = dataUrl;
    return c;
  }

  function iconFromSvg(svg, fallback) {
    var c = document.createElement("canvas");
    c.width = ICON_PX; c.height = ICON_PX;
    var g = c.getContext("2d");
    g.clearRect(0, 0, ICON_PX, ICON_PX);
    var im = new Image();
    im.onload = function () { g.drawImage(im, 0, 0, ICON_PX, ICON_PX); };
    im.onerror = function () {
      g.fillStyle = fallback; g.beginPath();
      g.arc(ICON_PX / 2, ICON_PX / 2, ICON_PX * 0.4, 0, Math.PI * 2); g.fill();
    };
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    return c;
  }

  var ICON = {
    ds: iconFromSvg(SVG_DS, "#4D6BFE"),
    gpt: iconFromPng("data:image/png;base64," + GPT_PNG_DATA, ICON_PX),
    claude: iconFromSvg(SVG_CLAUDE, "#D97757")
  };
  /* 便于区分绘制来源（不影响渲染） */
  for (var _ik in ICON) { if (ICON[_ik]) ICON[_ik]._tag = _ik; }


  /* ---- 粒子骨架：从任意图标里裁出实心区域，做成可采样的形状 ----
     炸 DS 用 DS 的形状，炸 GPT 用 GPT 的形状。 */
  function makeSkeleton(src) {
    var c = document.createElement("canvas");
    c.width = ICON_PX; c.height = ICON_PX;
    var g = c.getContext("2d");
    try {
      g.drawImage(src, 0, 0, ICON_PX, ICON_PX);
      var data = g.getImageData(0, 0, ICON_PX, ICON_PX).data;
      var minX = ICON_PX, minY = ICON_PX, maxX = -1, maxY = -1, x, y;
      for (y = 0; y < ICON_PX; y++) for (x = 0; x < ICON_PX; x++) {
        if (data[(y * ICON_PX + x) * 4 + 3] > 8) {
          if (x < minX) minX = x; if (x > maxX) maxX = x;
          if (y < minY) minY = y; if (y > maxY) maxY = y;
        }
      }
      if (maxX < 0) { minX = 0; minY = 0; maxX = ICON_PX - 1; maxY = ICON_PX - 1; }
      var w = maxX - minX + 1, h = maxY - minY + 1;
      var cut = document.createElement("canvas");
      cut.width = w; cut.height = h;
      var cg = cut.getContext("2d");
      cg.drawImage(src, minX, minY, w, h, 0, 0, w, h);
      return { w: w, h: h, map: cg.getImageData(0, 0, w, h).data };
    } catch (e) { return null; }
  }

  /* ================= 画布 ================= */

  var dust = [];
  function seedDust() {
    dust.length = 0;

        x: Math.random() * W, y: Math.random() * H,
        z: 0.25 + Math.random() * 0.75, s: 0.4 + Math.random() * 1.5,

  /* ================= 爆炸 / 粒子（沿用原有实现） ================= */
  var LIFE_BASE = 1200, LIFE_MIN = 0.70, LIFE_MAX = 1.45;
  var RUSH_MIN = 2.4, RUSH_MAX = 13.0, DRAG = 1.4;
  var MAX_PARTICLES = 7000, MAX_BURST_PARTICLES = 1400, BASE_PARTICLES = 320;

  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function samplePoints(skel, max) {
    var out = [];
    if (!skel || !skel.map) return out;
    var map = skel.map, sw = skel.w, sh = skel.h;
    var total = 0, cx = sw / 2, cy = sh / 2, scale = sh, x, y;
    for (y = 0; y < sh; y++) for (x = 0; x < sw; x++) {
      if (map[(y * sw + x) * 4 + 3] > 24) total++;
    }
    if (!total) return out;
    var take = Math.min(max, total), stride = total / take, k = 0, acc = 0;
    for (y = 0; y < sh; y++) for (x = 0; x < sw; x++) {
      if (map[(y * sw + x) * 4 + 3] <= 24) continue;
      acc += 1;
      if (acc >= k * stride) {
        k++;
        out.push({ nx: (x + 0.5 - cx) / scale, ny: (y + 0.5 - cy) / scale });
        if (k >= take) return out;
      }
    }
    return out;
  }

  function particleTarget(r, charge, q) {
    var n = Math.round((BASE_PARTICLES + (MAX_BURST_PARTICLES - BASE_PARTICLES) * q) * (0.75 + 0.45 * r / 400));
    return Math.max(BASE_PARTICLES * 0.5, Math.min(MAX_BURST_PARTICLES, n));
  }

  var bursts = [];
  var activeParticles = 0;

  function spawnBurst(x, y, r, charge, skel) {
    skel = skel || SKEL_DS;
    if (!skel) return;
    var q = charge * charge;
    var want = particleTarget(r, charge, q);
    var pts = samplePoints(skel, want);
    var rushMin = RUSH_MIN + (RUSH_MAX - RUSH_MIN) * q * 0.45;
    var rushMax = RUSH_MAX * (0.60 + 0.40 * charge);
    var lifeMin = LIFE_MIN + (LIFE_MAX - LIFE_MIN) * q * 0.50;
    var lifeMax = LIFE_MIN + (LIFE_MAX - LIFE_MIN) * (0.30 + 0.70 * charge);
    var win = 130 + 170 * charge;
    var particles = [];
    for (var i = 0; i < pts.length; i++) {
      if (activeParticles + particles.length >= MAX_PARTICLES) break;
      var p = pts[i];
      var px = x + p.nx * r, py = y + p.ny * r;
      var dx = px - x, dy = py - y;

      var sp = (rushMin + dist / r * (rushMax - rushMin)) * (0.65 + Math.random() * 0.7);
      particles.push({

        size: 0.9 + Math.random() * 1.7,

  /* 玩家蓄力爆炸（保留原有玩法） */
  var PRESS_CHARGE_MS = 1050, GROWTH = 1.88, GROWTH_MIN = 1.02;
  /* 按钮交互的"参考点重建窗口"（毫秒，上限）。
     真机实测：食指按/松按钮时，搭在屏幕上的拇指会被手部姿态带着漂移约 50px，鲸鱼会跟着漂。
     处理：按下与松开各开一个窗口，窗口内该手指只更新参考点、不产生位移；
           一旦该手指位移 ≤ REBASE_STILL_EPS（已经停住）就立刻结束窗口，
           所以通常只冻结几十毫秒，且与"按住多久"无关。 */
  var BTN_REBASE_MAX_MS = 100;
  var REBASE_STILL_EPS = 2;
  var FLIP_DEAD = 2.5;      // 翻转方向死区（累计位移像素）：滤掉触摸/触控板抖动
  var FLIP_STEP = 0.045;    // 翻转动画步进：约 22 帧 ≈ 350ms

  /* 主角半径：爆炸半径、光标尺寸都由它推导。

  function playerRadius() {
    if (IS_MOBILE) return Math.max(16, Math.min(W, H) * 0.055);
    return Math.min(48, Math.max(34, Math.min(W, H) * 0.052));
  }

  function explodeAt(x, y, charge, big) {
    var r = playerRadius() * (GROWTH_MIN + GROWTH * (1 - Math.pow(1 - clamp01(charge), 2.4)));
    if (big) r *= 2.6;
    spawnBurst(x, y, r, charge);
    playerGlow = 1;
    setShake(charge);
    /* 蓄力满时：把爆炸范围里的 GPT 一起炸烂（化为 GPT 形状的粒子） */

  }

  /* 炸烂爆心附近的 GPT：必须蓄力满 + 距离足够近。
     守卫做在函数内部，任何调用路径都不会误炸。 */
  function blastGpt(x, y, r, charge) {
    if (charge < CHARGE_FULL_AT) return 0;      // 没蓄满，炸不动
    var reach = r * 1.45 + 26;
    var killed = 0;
    for (var i = GAME.sats.length - 1; i >= 0; i--) {
      var s = GAME.sats[i];
      if (s.type !== "gpt") continue;
      var dx = s.x - x, dy = s.y - y;
      if (dx * dx + dy * dy > reach * reach) continue;

      spawnBurst(s.x, s.y, s.size * 0.92 * s.pulse, 1, SKEL_GPT);
      GAME.sats.splice(i, 1);
      GAME.kills++;

    }
    if (killed) setShake(1);
    return killed;
  }

  /* ================= 游戏 ================= */
  var hintEl = document.getElementById("hint");

  /* 难度按累计游玩时间爬升，60s 到顶；重开时清零 */

  function resetGame() {

  function playerDie() {

  /* ---------- 障碍物 ---------- */
  function spawnSat() {
    var d = difficulty();
    var roll = Math.random();
    if (roll < 0.5) spawnGpt(d);
    else spawnClaude(d);
    /* GPT 不再自动消失，所以生成间隔拉长一些，避免越堆越多 */
    GAME.nextSpawn = 1200 - 650 * d + Math.random() * (600 - 300 * d);
  }

  /* GPT：从画面外飞入，旋转 + 大小脉动，反弹若干次后飞出。个体之间大小/速度不一 */
  function spawnGpt(d) {
    var cap = maxObSize();
    var size = cap * (0.52 + Math.random() * 0.48);    // 每个个体大小不同（受窗口约束）
    var fromLeft = Math.random() < 0.5;
    var ang = (Math.random() - 0.5) * 1.1;
    var sp = (120 + 240 * d) * (0.65 + Math.random() * 0.85);   // 个体速度也有差异
    var vx = (fromLeft ? 1 : -1) * Math.cos(ang) * sp;
    var vy = Math.sin(ang) * sp;
    GAME.sats.push({
      type: "gpt", x: fromLeft ? -90 : W + 90, y: 80 + Math.random() * (H - 160),
      vx: vx, vy: vy, size: size, rot: Math.random() * 6.28,
      /* 小个子转得更快，大个子转得慢，看起来更有性格 */
      spin: (Math.random() < 0.5 ? -1 : 1) * (2.6 - size / 60) * (0.8 + 0.9 * d + Math.random() * 0.8),
      pulse: 1, pulseT: Math.random() * 6.28,
      bounce: 2 + Math.round(3 * d + Math.random() * 2), edge: 0.16 + 0.30 * d,
      life: 11 - 3 * d
    });
  }

  /* 障碍物尺寸上限随窗口短边变化，小屏不放巨物 */
  function maxObSize() { return Math.min(104, Math.max(54, Math.min(W, H) * 0.125)); }

  /* 只在画面四周的边缘带里取点：避开中间区域 */
  function edgeSpot() {
    var m = 70;
    var band = Math.max(90, Math.min(W, H) * 0.17);
    var side = Math.floor(Math.random() * 4);
    if (side === 0) return { x: m + Math.random() * (W - m * 2), y: m + Math.random() * band };                    // 上
    if (side === 1) return { x: m + Math.random() * (W - m * 2), y: H - m - Math.random() * band };                // 下
    if (side === 2) return { x: m + Math.random() * band, y: m + Math.random() * (H - m * 2) };                    // 左
    return { x: W - m - Math.random() * band, y: m + Math.random() * (H - m * 2) };                                // 右
  }

  /* 找一个离玩家足够远的随机位置，避免贴脸生成来不及反应 */
  function farSpot(minDist) {
    var margin = 70;
    for (var i = 0; i < 40; i++) {
      var x = margin + Math.random() * Math.max(1, W - margin * 2);
      var y = margin + Math.random() * Math.max(1, H - margin * 2);
      var dx = x - GAME.player.x, dy = y - GAME.player.y;
      if (dx * dx + dy * dy >= minDist * minDist) return { x: x, y: y };
    }
    /* 兜底：取离玩家最远的那个角 */
    return {
      x: GAME.player.x < W / 2 ? W - margin : margin,
      y: GAME.player.y < H / 2 ? H - margin : margin
    };
  }

  function spawnClaude(d) {
    var size = maxObSize() * (0.60 + Math.random() * 0.40);

      type: "claude", x: spot.x, y: spot.y,
      size: size, rot: Math.random() * Math.PI * 2, appears: 0, life: 6 + 4 * d,
      volleys: 2 + Math.round(1.4 * d), fired: 0, cd: 1100, rays: [], wave: []
    });

  function fireRays(sat) {
    var d = difficulty();
    /* 射线根数 1~5 根随机，大体型偏向更多根 */
    var lo = Math.random() < 0.5 ? 1 : 2;
    var hi = 5;
    var n = lo + Math.floor(Math.random() * (hi - lo + 1));
    if (sat.size > 76 && n < 3) n = 3;        // 大 Claude 至少 3 根
    var base = Math.random() * 6.28;
    for (var i = 0; i < n; i++) {
      var ang = base + i * (6.283 / n) + (Math.random() - 0.5) * 0.45;

  function updateSats(dt, f) {
    var d = difficulty();
    var i, j, s;
    GAME.elapsed += dt;
    GAME.playTime += dt;

    for (i = GAME.sats.length - 1; i >= 0; i--) {
      s = GAME.sats[i];
      s.life -= dt / 1000;

      if (s.type === "gpt") {
        s.x += s.vx * dt / 1000;
        s.y += s.vy * dt / 1000;
        s.rot += s.spin * dt / 1000;
        s.pulseT += dt / 1000 * 4.2;
        s.pulse = 1 + 0.20 * Math.sin(s.pulseT);       // 视觉大小持续变化
        if (!s.noBounce) {
          if (s.x < s.size * 0.6 && s.vx < 0) bounce(s, "x");
          if (s.x > W - s.size * 0.6 && s.vx > 0) bounce(s, "x");
          if (s.y < s.size * 0.6 && s.vy < 0) bounce(s, "y");
          if (s.y > H - s.size * 0.6 && s.vy > 0) bounce(s, "y");

        if (s.x > -40 && s.x < W + 40 && s.y > -40 && s.y < H + 40) {
          s.wasIn = true;
          s.reenter = undefined;

          s.reenter -= dt;
          if (s.reenter <= 0) reenter(s);

          w.t += dt;
          if (w.state === "warn" && w.t >= w.warn) { w.state = "active"; w.t = 0; }
          else if (w.state === "active" && w.t >= w.life) s.wave.splice(j, 1);

  /* 飞到画面外的 GPT 重新入场：从随机一边飞回来 */
  function reenter(s) {

    s.x = fromLeft ? -90 : W + 90;              // 就在屏幕外一点，马上会飞进来
    s.y = 80 + Math.random() * Math.max(1, H - 160);
    s.vx = (fromLeft ? 1 : -1) * Math.cos(ang) * sp;
    s.vy = Math.sin(ang) * sp;
    s.bounce = 2 + Math.round(3 * difficulty() + Math.random() * 2);
    s.noBounce = false;
    s.edge = 0.16 + 0.30 * difficulty();
    s.reenter = undefined;
    s.wasIn = false;
  }

  function bounce(s, axis) {
    var half = s.size * 0.6;
    if (axis === "x") {
      s.x = s.vx > 0 ? W - half : half;
      s.vx = -s.vx;
    } else {
      s.y = s.vy > 0 ? H - half : half;
      s.vy = -s.vy;
    }
    s.spin = -s.spin * 1.12;
    s.bounce--;
    if (s.bounce <= 0) { s.edge = 0; s.noBounce = true; }   // 反弹次数用完 -> 允许飞出
  }

  /* ---------- 碰撞 ---------- */
  function hitPlayer(x, y, r) {
    var dx = x - GAME.player.x, dy = y - GAME.player.y;
    var rr = r + GAME.player.r * 0.62;
    return dx * dx + dy * dy < rr * rr;
  }

  function checkCollisions() {
    var p = GAME.player;
    for (var i = 0; i < GAME.sats.length; i++) {
      var s = GAME.sats[i];
      if (s.type === "gpt") {
        if (hitPlayer(s.x, s.y, s.size * 0.44 * s.pulse)) return true;
      } else if (s.appears > 0.5) {
        if (hitPlayer(s.x, s.y, s.size * 0.42)) return true;
        if (s.type === "claude" && s.wave) {
          for (var j = 0; j < s.wave.length; j++) {
            var w = s.wave[j];

            /* 点到射线的距离 */

            var vx = p.x - s.x, vy = p.y - s.y;
            var proj = vx * ca + vy * sa;
            if (proj < 0) continue;
            var perp = Math.abs(-vx * sa + vy * ca);
            if (perp < 9 + p.r * 0.45 && proj < w.len) return true;
          }

      }
    }
    return false;
  }

  /* ================= 输入 =================

  var boomBtn = document.getElementById("boomBtn");

  /* 移动端爆炸按钮：只表示是否就绪，进度环仍画在 DS 身上 */
  function refreshBoomBtn() {
    if (!IS_MOBILE || !boomBtn) return;

    boomBtn.classList.toggle("ready", playing && GAME.autoCharge >= 1);
  }

  /* 释放爆炸：按钮始终可点，这里只判断“能不能炸”。

  function mobileBoom() {
    if (GAME.state !== "play") return false;
    if (GAME.autoCharge < 1) return false;      // 未蓄满：不爆炸
    GAME.autoCharge = 0;                        // 释放后从头蓄力
    explodeAt(GAME.player.x, GAME.player.y, 1);
    return true;
  }

  var boomWaitTimer = 0;
  if (boomBtn) {
    /* 按钮始终可用：任何一次按下都会被按钮接收（不会被当成滑动） */
    boomBtn.addEventListener("pointerdown", function (ev) {
      ev.stopPropagation();                     // 不要触发“滑动/开始游戏”
      ev.preventDefault();
      /* 按钮上的触点不参与滑动。
         注意：只清掉“按按钮的这根手指”自己的滑动状态——
         如果另一根手指正在拖拽，动它会直接打断拖动（玩家得重新按一次）。 */
      if (GAME.touch && GAME.touch.id === ev.pointerId) GAME.touch = null;
      GAME.btnPointer = ev.pointerId;
      /* 按下瞬间开一个很短的"重建参考点"窗口：吃掉按下去那一下的拇指漂移。
         窗口与"按住多久"无关（上限 BTN_REBASE_MAX_MS，且手指一停就提前结束），
         所以按住按钮期间仍然可以正常拖拽。 */
      GAME.rebaseUntil = performance.now() + BTN_REBASE_MAX_MS;
      var fired = mobileBoom();
      if (fired) {
        boomBtn.classList.remove("wait");
      } else if (GAME.state === "play") {
        /* 未蓄满：不爆炸，但给一个明确反馈，让玩家知道这一下被收到了 */
        if (boomWaitTimer) window.clearTimeout(boomWaitTimer);
        boomBtn.classList.add("wait");
        boomWaitTimer = window.setTimeout(function () {
          boomWaitTimer = 0;
          boomBtn.classList.remove("wait");
        }, 240);
      }
      refreshBoomBtn();
    });
  }

  window.addEventListener("pointermove", function (ev) {
    if (IS_MOBILE) {
      var t = GAME.touch;
      if (!t || ev.pointerId !== t.id) return;
      /* 按钮交互的"幽灵漂移"窗口：按/松按钮时，搭在屏幕上的另一根手指会被手部姿态
         带着漂移约 50px（真机实测），这里让该手指只更新参考点、不产生位移。
         窗口上限 BTN_REBASE_MAX_MS，但只要检测到手指已经停住（本次位移 ≤ REBASE_STILL_EPS）
         就立刻结束窗口 —— 所以通常只冻结几十毫秒，且与按住多久无关。
         注意：绝不清空 GAME.touch，窗口一过拖拽立刻继续，不需要重新按屏幕。 */
      if (performance.now() < GAME.rebaseUntil) {
        var rdx = ev.clientX - t.lastX, rdy = ev.clientY - t.lastY;
        t.lastX = ev.clientX; t.lastY = ev.clientY;
        t.dx = 0; t.dy = 0;
        if (Math.abs(rdx) <= REBASE_STILL_EPS && Math.abs(rdy) <= REBASE_STILL_EPS) {
          GAME.rebaseUntil = 0;                 // 漂移结束（手指停住）：立刻恢复拖拽
        }
        return;
      }
      if (GAME.btnPointer !== null && ev.pointerId === GAME.btnPointer) return;   // 按钮上的触点在拖拽也不移动
      t.dx += ev.clientX - t.lastX;             // 累计本帧滑动位移
      t.dy += ev.clientY - t.lastY;
      t.lastX = ev.clientX;
      t.lastY = ev.clientY;
      return;
    }
    mouse.x = ev.clientX; mouse.y = ev.clientY; mouse.inside = true;
  }, { passive: true });

  window.addEventListener("pointerdown", function (ev) {
    if (IS_MOBILE) {
      if (GAME.state !== "play") { resetGame(); return; }   // 触摸任意处开始 / 重开
      /* 每次按下都重建基准：即使上一次的 pointerup 丢了，
         也不会拿旧的 lastX 去和本次触点相减而跳变 */
      GAME.touch = { id: ev.pointerId, lastX: ev.clientX, lastY: ev.clientY, dx: 0, dy: 0 };
      /* 全新按下是一次明确的拖拽意图：结束上一个漂移窗口（按钮的事件被
         stopPropagation 拦住，走不到这里，所以不会误清按钮触发的窗口） */
      GAME.rebaseUntil = 0;
      /* 这根手指现在开始拖拽了；如果它曾被登记为按钮指针（按钮的 pointerup 丢了），
         在这里解除，避免此后所有移动都被忽略、必须再点一次才能恢复 */
      if (GAME.btnPointer !== null && GAME.btnPointer === ev.pointerId) GAME.btnPointer = null;
      return;
    }
    if (ev.button !== undefined && ev.button !== 0 && ev.pointerType === "mouse") return;
    mouse.x = ev.clientX; mouse.y = ev.clientY; mouse.inside = true;
    mouse.clickFrames = 16;                     // 光标点击反馈：约 16 帧膨胀后衰减
    if (GAME.state !== "play") { resetGame(); return; }
    if (!GAME.press) GAME.press = { t0: performance.now() };
  }, { passive: true });

  function releasePress() {
    if (!GAME.press || GAME.state !== "play") { GAME.press = null; return; }
    var held = performance.now() - GAME.press.t0;
    var charge = clamp01(held / PRESS_CHARGE_MS);
    GAME.press = null;
    explodeAt(GAME.player.x, GAME.player.y, Math.max(0.05, charge));
  }
  window.addEventListener("pointerup", function (ev) {
    if (IS_MOBILE) {
      if (GAME.btnPointer !== null && ev.pointerId === GAME.btnPointer) {
        GAME.btnPointer = null;
        /* 松开瞬间拇指会往回漂一次，用同样的短窗口把它也吃掉（否则鲸鱼会被往下带一次） */
        GAME.rebaseUntil = performance.now() + BTN_REBASE_MAX_MS;
      }
      if (GAME.touch && ev.pointerId === GAME.touch.id) GAME.touch = null;   // 抬手立即停
      return;
    }
    releasePress();
  }, { passive: true });
  window.addEventListener("pointercancel", function (ev) {
    if (IS_MOBILE) { GAME.touch = null; GAME.btnPointer = null; GAME.rebaseUntil = 0; return; }
    GAME.press = null;
  }, { passive: true });

  window.addEventListener("keydown", function (ev) {
    /* 正在输入用户名时，空格/回车不能被当成"重开" */
    if (pnameEl && document.activeElement === pnameEl) return;
    if (ev.code !== "Space" && ev.key !== "Enter") return;
    ev.preventDefault && ev.preventDefault();
    if (GAME.state !== "play") { resetGame(); return; }
    if (IS_MOBILE) { mobileBoom(); return; }     // 移动端：空格等同按爆炸按钮
    if (!GAME.press) GAME.press = { t0: performance.now() };
  });
  window.addEventListener("keyup", function (ev) {
    if (ev.code !== "Space" && ev.key !== "Enter") return;
    if (!IS_MOBILE) releasePress();
  });
  window.addEventListener("blur", function () { GAME.press = null; GAME.touch = null; GAME.btnPointer = null; });

  /* ================= 绘制 ================= */
  /* flipX / flipY：翻转用的水平、垂直缩放。
     flipX: +1 = 原图，-1 = 左右镜像，中间的数值 = 翻转动画过程。
     镜像用 ctx.scale(-1,1) 实现（而不是给 drawImage 传负宽度），兼容性更稳；
     flipY 让翻转中途轻微压扁，看起来是“转身”而不是“压扁”。 */
  function drawIcon(img, x, y, size, rot, alpha, glow, glowColor, flipX, flipY) {
    var fx = (flipX === undefined) ? 1 : flipX;
    var fy = (flipY === undefined) ? 1 : flipY;
    var g = ICON_PX;
    if (Math.abs(fx) < 0.03) fx = fx < 0 ? -0.03 : 0.03;   // 避免宽度退化为 0
    var w = size * Math.abs(fx);
    var h = size * fy;
    ctx.save();
    ctx.translate(x, y);
    if (fx < 0) ctx.scale(-1, 1);
    if (rot) ctx.rotate(rot);
    if (glow) {
      ctx.shadowColor = glowColor || "#4D6BFE";
      ctx.shadowBlur = glow;
    }
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.drawImage(img, -w / 2, -h / 2, w, h);
    ctx.restore();
  }

  function drawPlayer(now) {
    var p = GAME.player;
    var charge = IS_MOBILE
      ? GAME.autoCharge
      : (GAME.press ? clamp01((now - GAME.press.t0) / PRESS_CHARGE_MS) : 0);
    var size = p.r * 2 * (1 + 0.30 * charge);
    /* 图标原图朝左：往右移动翻成朝右，往左移动翻回朝左；
       翻转后保持该朝向，直到下一次反向移动。
       方向判定 = 累计位移 + 死区（FLIP_DEAD）：手指/触控板的微小抖动会被滤掉，
       而真实移动累积几帧就能越过阈值，所以既不误翻也不迟钝。
       翻转动画约 350ms；若中途方向又变回来，动画会倒着走回去而不是瞬间弹回，
       这样就不会出现“翻到一半又跳回去”的闪烁。 */
    var dxs;
    if (IS_MOBILE) {
      dxs = p.x - p.lastX;                      // 移动端：看本体实际位移
      p.lastX = p.x;
    } else {
      dxs = p.tx - (p.lastTx === undefined ? p.tx : p.lastTx);
      p.lastTx = p.tx;
    }
    p.dxAcc = (p.dxAcc === undefined ? 0 : p.dxAcc) + dxs;
    if (p.dxAcc > FLIP_DEAD) { p.flipWant = -1; p.dxAcc = 0; }        // 往右挪 -> 镜像
    else if (p.dxAcc < -FLIP_DEAD) { p.flipWant = 1; p.dxAcc = 0; }   // 往左挪 -> 原图
    if (p.flipWant === undefined) p.flipWant = p.flip;

    var anim = 0;                                  // +1 正转，-1 倒带
    if (p.flipWant !== p.flip) anim = 1;
    else if (p.flipT > 0) anim = -1;

    if (anim !== 0) {
      p.flipT = clamp01(p.flipT + FLIP_STEP * anim);
      if (anim > 0 && p.flipT >= 1) {              // 转到位
        p.flip = p.flipWant;
        p.flipT = 0;
        p.flipS = p.flip;
        p.flipY = 1;
      } else if (anim < 0 && p.flipT <= 0) {       // 倒带回原位
        p.flipT = 0;
        p.flipS = p.flip;
        p.flipY = 1;
      } else {
        p.flipS = Math.cos(Math.PI * p.flipT) * p.flip;       // 1 -> 0 -> -1
        p.flipY = 1 - 0.14 * Math.sin(Math.PI * p.flipT);     // 中途压扁，像真的在转身
      }
    } else {
      p.flipS = p.flip;
      p.flipY = 1;
    }
    var rot = charge * Math.sin(now * 0.05) * 0.05;   // 仅蓄力时的轻微抖动

    /* 蓄力进度环 */
    if (charge > 0.02) {
      ctx.save();
      ctx.globalAlpha = 0.30 + 0.5 * charge;
      ctx.strokeStyle = "rgba(150,190,255,1)";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 1.75, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * charge);
      ctx.stroke();
      ctx.restore();
    }

    var glow = 14 + 26 * charge + playerGlow * 26;
    drawIcon(ICON.ds, p.x, p.y, size, rot, 1, glow, "rgba(77,107,254,0.95)", p.flipS, p.flipY);

    /* 生命光晕 */
    if (playerGlow > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = playerGlow * 0.35;
      var rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      rg.addColorStop(0, "rgba(120,160,255,0.7)");
      rg.addColorStop(1, "rgba(60,90,255,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function drawSats(now) {
    var i, j;
    for (i = 0; i < GAME.sats.length; i++) {
      var s = GAME.sats[i];

      if (s.type === "gpt") {
        var fl = 1;
        if (s.noBounce) {
          /* 快飞出画面时淡出 */
          var m = Math.min(s.x, W - s.x, s.y, H - s.y);
          fl = clamp01(m / 140);
        }
        drawIcon(ICON.gpt, s.x, s.y, s.size * s.pulse, s.rot, fl, 16, "rgba(16,163,127,0.9)");
        continue;
      }

      var al = s.appears < 1 ? s.appears : (s.life < 0.6 ? clamp01(s.life / 0.6) : 1);
      drawIcon(ICON[s.type], s.x, s.y, s.size, s.rot, al, 14, "rgba(217,119,87,0.9)");

      if (s.type === "claude") {
        for (j = 0; j < s.wave.length; j++) {
          var w = s.wave[j];
          var ca = Math.cos(w.ang), sa = Math.sin(w.ang);
          var x2 = s.x + ca * w.len, y2 = s.y + sa * w.len;
          if (w.state === "warn") {
            /* 预警：闪烁细线，越接近发射越亮越粗（粗细随本体大小） */
            var pr = clamp01(w.t / w.warn);
            var blink = (0.35 + 0.65 * (Math.sin(w.t * 0.045) > 0 ? 1 : 0.15));
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.globalAlpha = (0.22 + 0.6 * pr) * blink;
            ctx.strokeStyle = "#FFB37A";
            ctx.lineWidth = (1 + 3.5 * pr) * w.w;
            ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.restore();
          } else {
            var ta = 1 - clamp01(w.t / w.life);
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            var lg = ctx.createLinearGradient(s.x, s.y, x2, y2);
            lg.addColorStop(0, "rgba(255,190,130," + (0.85 * ta).toFixed(3) + ")");
            lg.addColorStop(0.5, "rgba(217,119,87," + (0.5 * ta).toFixed(3) + ")");
            lg.addColorStop(1, "rgba(217,119,87,0)");
            ctx.strokeStyle = lg;
            ctx.lineWidth = (16 * ta + 3) * w.w;
            ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.strokeStyle = "rgba(255,235,215," + (0.85 * ta).toFixed(3) + ")";
            ctx.lineWidth = (2.5 * ta + 0.8) * w.w;
            ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.restore();
          }
        }

      }
    }
  }

  function drawBursts(now, dt, f) {
    var blit = null;
    /* 活跃粒子数每帧实算，避免“出生时加、消亡时减”的计数器不同步 */
    activeParticles = 0;
    for (var b = bursts.length - 1; b >= 0; b--) {
      var bu = bursts[b];
      var age = now - bu.start;

      var flashDur = 320 + 260 * bu.charge;
      if (age < flashDur) {
        var bt = age / flashDur;
        var fa = Math.pow(1 - bt, 1.5);
        var fr = bu.w1 * (0.35 + 1.5 * easeOutCubic(bt));
        var fg = ctx.createRadialGradient(bu.x, bu.y, 0, bu.x, bu.y, fr);
        fg.addColorStop(0, "rgba(255,255,255," + ((0.55 + 0.3 * bu.charge) * fa).toFixed(3) + ")");
        fg.addColorStop(0.3, "rgba(150,175,255," + (0.30 * fa).toFixed(3) + ")");
        fg.addColorStop(0.65, "rgba(77,107,254," + (0.14 * fa).toFixed(3) + ")");
        fg.addColorStop(1, "rgba(30,45,150,0)");
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(bu.x, bu.y, fr, 0, Math.PI * 2); ctx.fill();
      }

      if (age < 620) {
        var rt2 = age / 620;
        var ringR = bu.w1 * (0.45 + 1.15 * easeOutCubic(rt2));
        var ra = Math.pow(1 - rt2, 1.7);
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = "rgba(120,158,255," + (0.34 * ra).toFixed(3) + ")";
        ctx.lineWidth = 1.2 + 2.6 * (1 - rt2);
        ctx.beginPath(); ctx.arc(bu.x, bu.y, ringR, 0, Math.PI * 2); ctx.stroke();
        ctx.globalCompositeOperation = "source-over";
      }

      ctx.globalCompositeOperation = "lighter";
      var col = "rgba(" + PART_RGB[0] + "," + PART_RGB[1] + "," + PART_RGB[2] + ",";
      var lifeMax = LIFE_BASE * LIFE_MAX + 320;
      for (var i = 0; i < bu.particles.length; i++) {
        var p = bu.particles[i];
        if (age < p.birth) { activeParticles++; continue; }      // 尚未出生，仍占位
        var ct = age - p.birth;
        var at = ct / (LIFE_BASE * p.life);
        if (at > 1) continue;                                    // 已消亡
        var drag = Math.exp(-DRAG * (dt / 1000));
        p.vx *= drag; p.vy *= drag;
        p.x += p.vx * f; p.y += p.vy * f;
        ctx.fillStyle = col + (1 - at).toFixed(3) + ")";
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        activeParticles++;
      }
      /* 回收条件独立判断：即使一粒都没生成（粒子数触顶）也能被回收 */
      if (age > bu.birthWin + lifeMax) bursts.splice(b, 1);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  /* ================= HUD ================= */
  function drawHud() {
    if (GAME.state === "play") {
      var d = difficulty();
      hudEl.innerHTML =
        "<span>时间 <b>" + (GAME.elapsed / 1000).toFixed(1) + " 秒</b></span>" +
        "<span>威胁 <b>" + GAME.sats.length + "</b></span>" +
        "<span>危险 <b>" + Math.round(d * 100) + "%</b></span>";
      hudEl.classList.remove("hidden");
    } else {
      hudEl.classList.add("hidden");
    }
    refreshBoomBtn();                           // 移动端：同步爆炸按钮就绪状态
  }

  /* ================= 主循环 ================= */
  var last = performance.now();

  function frame(now) {
    var dt = Math.min(48, now - last);
    last = now;
    var f = dt / 16.6667;

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = "lighter";
    for (var d = 0; d < dust.length; d++) {
      var du = dust[d];
      du.x += du.vx * f; du.y += du.vy * f;
      du.tw += du.tws * (dt / 1000);
      if (du.y < -4) { du.y = H + 4; du.x = Math.random() * W; }
      if (du.x < -4) du.x = W + 4;
      if (du.x > W + 4) du.x = -4;
      var da = (0.10 + 0.16 * (0.5 + 0.5 * Math.sin(du.tw))) * du.z;
      ctx.fillStyle = "rgba(150,180,255," + da.toFixed(3) + ")";
      ctx.beginPath(); ctx.arc(du.x, du.y, du.s * du.z, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    /* 主角移动：桌面端平滑跟随光标；移动端由滑动位移直接驱动（速度与手指一致） */
    var p = GAME.player;
    if (GAME.state === "play") {
      if (IS_MOBILE) {
        p.r = playerRadius();                   // 尺寸随屏幕走，爆炸范围同源一起缩放
        if (GAME.touch) {
          p.x += GAME.touch.dx;                 // 位移 1:1；抬手时 touch 置空即立刻停
          p.y += GAME.touch.dy;
          GAME.touch.dx = 0;
          GAME.touch.dy = 0;
        }
        if (GAME.autoCharge < 1) {              // 自动蓄力，蓄满后保持
          GAME.autoCharge = Math.min(1, GAME.autoCharge + dt / PRESS_CHARGE_MS);
        }
      } else {
        p.tx = mouse.inside ? mouse.x : p.tx;
        p.ty = mouse.inside ? mouse.y : p.ty;
        var k = 1 - Math.exp(-dt / 55);
        p.x += (p.tx - p.x) * k;
        p.y += (p.ty - p.y) * k;
      }
      p.x = Math.max(p.r, Math.min(W - p.r, p.x));
      p.y = Math.max(p.r, Math.min(H - p.r, p.y));
      updateSats(dt, f);
      if (checkCollisions()) playerDie();
    }

    drawBursts(now, dt, f);
    if (mouse.clickFrames > 0) mouse.clickFrames--;      // 推进光标点击动画
    if (GAME.state === "title") {
      drawTitleMark(now);                     // 标题界面：上方 2/3 的呼吸大图标
      drawCursor(now);                        // 系统光标已隐藏，用微缩 DS 顶替
    } else if (GAME.state === "dead") {
      drawCursor(now);                        // 结束界面同样用微缩 DS 当光标
    } else {
      drawPlayer(now);
    }
    if (GAME.state === "play" || GAME.state === "dead") drawSats(now);

    playerGlow *= Math.exp(-dt / 260);
    drawHud();

    /* 屏幕震动 */
    if (shakeAmp > 0) {
      var shk = shakeT / SHAKE_MS;
      if (shk >= 1) { shakeAmp = 0; shakeEl.style.transform = ""; }
      else {
        shakeT += dt;
        var decay = Math.pow(1 - shk, 1.5);
        shakeEl.style.transform = "translate(" +
          ((Math.random() - 0.5) * shakeAmp * decay).toFixed(2) + "px," +
          ((Math.random() - 0.5) * shakeAmp * decay).toFixed(2) + "px)";
      }
    }

    requestAnimationFrame(frame);
  }

  /* 标题 / 结束界面：用一个微缩 DS 图标代替鼠标光标。
     点击（按下）后约 16 帧内微微膨胀并发光，用帧计数驱动，
     不依赖时间戳，避免 rAF 与 performance.now 基准不一致。 */
  function drawCursor(now) {
    if (IS_MOBILE) return;                      // 移动端不画触摸点光标
    if (!mouse.inside) return;
    var k = (mouse.clickFrames > 0) ? mouse.clickFrames / 16 : 0;   // 1 -> 0
    var ease = k * k;                                               // 快速衰减
    var size = playerRadius() * 1.5 * (1 + 0.34 * ease);            // 微缩版，约 0.75× 主角
    var glow = 14 + 46 * ease;
    mouse.size = size;                                              // 供调试读取
    mouse.glow = glow;
    drawIcon(ICON.ds, mouse.x, mouse.y, size, 0, 1, glow, "rgba(77,107,254,0.95)", 1, 1);
    if (ease > 0.02) {                                              // 点击瞬间的一圈扩散光
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.42 * ease;
      var r = size * (0.72 + 0.55 * (1 - k));
      var rg2 = ctx.createRadialGradient(mouse.x, mouse.y, size * 0.25, mouse.x, mouse.y, r);
      rg2.addColorStop(0, "rgba(150,185,255,0.85)");
      rg2.addColorStop(1, "rgba(60,90,255,0)");
      ctx.fillStyle = rg2;
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  /* ================= 标题界面：上方 2/3 一个呼吸的 DS 图标 ================= */
  function drawTitleMark(now) {
    var t = now / 1000;
    var base = Math.min(W * 0.34, H * 0.40);          // 大图标
    var scale = 1 + 0.045 * Math.sin(t * 1.25);       // 呼吸：尺寸微微起伏
    var pulse = 0.5 + 0.5 * Math.sin(t * 1.25);       // 与尺寸同步的荧光明暗
    var size = base * scale;
    var cx = W / 2, cy = H * 0.36;                    // 落在上方 2/3 的中间

    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    /* 外层呼吸光晕 */
    var halo = size * (1.5 + 0.14 * pulse);
    var rg = ctx.createRadialGradient(cx, cy, size * 0.15, cx, cy, halo);
    rg.addColorStop(0, "rgba(110,150,255," + (0.30 + 0.16 * pulse).toFixed(3) + ")");
    rg.addColorStop(0.45, "rgba(77,107,254," + (0.14 + 0.08 * pulse).toFixed(3) + ")");
    rg.addColorStop(1, "rgba(40,60,180,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(cx, cy, halo, 0, Math.PI * 2); ctx.fill();

    /* 一圈随呼吸扩散的细环 */
    var ringR = size * (0.72 + 0.30 * pulse);
    ctx.globalAlpha = 0.10 + 0.16 * (1 - pulse);
    ctx.strokeStyle = "rgba(150,190,255,1)";
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();

    /* 图标本体：发光强度跟着呼吸 */
    var glow = 26 + 34 * pulse;
    drawIcon(ICON.ds, cx, cy, size, 0, 1, glow, "rgba(77,107,254,0.95)", 1, 1);
  }

  /* 标题界面：下 1/3 放玩法介绍，上 2/3 留给呼吸图标 */
  hintEl.innerHTML = IS_MOBILE
    ? "<b>DEEPSEEK&nbsp;·&nbsp;爆裂求生</b>" +
      "<em>滑动屏幕移动 <i>DeepSeek</i> 躲避其他AI的攻击</em>" +
      "<em><i>ChatGPT</i> 旋转飞行 · <i>Claude</i> 放射线</em>" +
      "<em>蓄力会自动充满，点 <i>爆炸</i> 按钮炸烂身边的 ChatGPT</em>" +
      "<em>触摸屏幕任意位置开始</em>"
    : "<b>DEEPSEEK&nbsp;·&nbsp;爆裂求生</b>" +
      "<em>移动鼠标引导 <i>DeepSeek</i> 躲避其他AI的攻击</em>" +
      "<em><i>ChatGPT</i> 旋转飞行 · <i>Claude</i> 放射线</em>" +
      "<em>贴近ChatGPT后 <i>蓄力爆炸</i> 可以把它炸烂</em>" +
      "<em>按 <i>空格</i> 或点击开始</em>";

  /* ================= 排行榜（Supabase，纯 fetch 调 REST） =================
     设计要点：
     · 不引任何 SDK，直接打 PostgREST；表：leaderboard(player_name, kills, survival_time, created_at)
     · 排序口径：存活时间优先、击杀次之
     · 一人一行：user 名唯一；同名再提交时由数据库函数 submit_score 只在成绩更好时覆盖
     · 浏览器读不到 content-range（未配 expose-headers），所以名次 = "严格优于我的人数" + 1
     · 任何失败都只影响这块 UI，绝不打断游戏（统一返回 {ok,status,data}，不抛异常） */
  var SUPA = {
    url: "https://eewpfpnuahbdqfjbenje.supabase.co",
    key: "sb_publishable_Q4YEPcnsorDKFKxyF4WIvA_xKYIpzBO",
    table: "leaderboard",
    rpc: "submit_score",
    nameKey: "ds_leaderboard_name",
    limit: 10
  };

  var overEl = document.getElementById("over");
  var boardListEl = document.getElementById("boardList");
  var myRankEl = document.getElementById("myrank");
  var pnameEl = document.getElementById("pname");
  var subBtn = document.getElementById("submitBtn");
  var subMsgEl = document.getElementById("submsg");
  var ovSurvEl = document.getElementById("ovSurv");
  var ovKillsEl = document.getElementById("ovKills");

  function sbUrl(path) { return SUPA.url.replace(/\/+$/, "") + "/rest/v1/" + path; }
  function sbReq(method, path, opts) {
    opts = opts || {};
    var headers = { apikey: SUPA.key, Authorization: "Bearer " + SUPA.key, "Content-Type": "application/json" };
    if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];
    return fetch(sbUrl(path), {
      method: method, headers: headers,
      body: opts.body === undefined ? undefined : JSON.stringify(opts.body)
    }).then(function (r) {
      return r.text().then(function (t) {
        var data = null;
        try { data = t ? JSON.parse(t) : null; } catch (e) { data = t; }
        return { ok: r.ok, status: r.status, data: data };
      });
    }).catch(function (e) {
      return { ok: false, status: 0, data: (e && e.message) || String(e) };
    });
  }
  function briefErr(res) {
    var d = res && res.data;
    if (res && res.status === 0) return "网络不可达";
    if (d && d.message) return d.message;
    if (typeof d === "string" && d) return d.slice(0, 80);
    return "HTTP " + (res ? res.status : "?");
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function savedName() { try { return window.localStorage.getItem(SUPA.nameKey) || ""; } catch (e) { return ""; } }
  function rememberName(n) { try { window.localStorage.setItem(SUPA.nameKey, n); } catch (e) {} }
  function setSubMsg(t, cls) { if (subMsgEl) { subMsgEl.textContent = t || ""; subMsgEl.className = cls || ""; } }

  /* ---------- 结束界面 ---------- */
  function showOver() {
    if (!overEl) return;
    ovSurvEl.textContent = (GAME.elapsed / 1000).toFixed(1);
    ovKillsEl.textContent = GAME.kills;
    if (!pnameEl.value) pnameEl.value = savedName();
    setSubMsg("");
    subBtn.disabled = false;
    overEl.classList.add("show");
    boardLoad();
  }
  function hideOver() { if (overEl) overEl.classList.remove("show"); }

  /* 结束界面自己吃掉 pointerdown，避免点输入框/按钮被当成"点击画面重新开始" */
  if (overEl) {
    overEl.addEventListener("pointerdown", function (ev) { ev.stopPropagation(); });
    overEl.addEventListener("click", function (ev) { ev.stopPropagation(); });
  }
  if (subBtn) subBtn.addEventListener("click", function () { submitScore(); });
  if (pnameEl) {
    pnameEl.addEventListener("keydown", function (ev) {
      ev.stopPropagation();
      if (ev.key === "Enter") { ev.preventDefault(); submitScore(); }
    });
  }

  /* ---------- 读榜 ---------- */
  function boardLoad() {
    boardListEl.innerHTML = '<li><span class="rk"></span><span class="nm">加载中…</span></li>';
    myRankEl.textContent = "";
    return sbReq("GET", SUPA.table + "?select=player_name,kills,survival_time" +
                        "&order=survival_time.desc,kills.desc&limit=" + SUPA.limit)
      .then(function (res) {
        if (!res.ok || !Array.isArray(res.data)) {
          boardListEl.innerHTML = '<li><span class="rk"></span><span class="nm">排行榜暂不可用（' + esc(briefErr(res)) + '）</span></li>';
          return;
        }
        renderBoard(res.data, savedName());
        return refreshMyRank();
      });
  }
  function renderBoard(rows, me) {
    if (!rows.length) {
      boardListEl.innerHTML = '<li><span class="rk"></span><span class="nm">还没有人上榜，你可以是第一个</span></li>';
      return;
    }
    var html = "";
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var isMe = me && r.player_name === me;
      html += '<li class="' + (isMe ? "me" : "") + '">' +
                '<span class="rk">' + (i + 1) + "</span>" +
                '<span class="nm">' + esc(r.player_name) + "</span>" +
                '<span class="sc">' + r.survival_time + "s / " + r.kills + "杀</span>" +
              "</li>";
    }
    boardListEl.innerHTML = html;
  }

  /* 名次 = 严格优于我的人数 + 1（int 比较，避免 JSON 里的字段名歧义） */
  function countBetter(surv, kills) {
    var f = "or=(survival_time.gt." + surv + ",and(survival_time.eq." + surv + ",kills.gt." + kills + "))";
    return sbReq("GET", SUPA.table + "?select=id&" + encodeURI(f) + "&limit=1000");
  }
  function refreshMyRank() {
    var name = savedName();
    if (!name) { myRankEl.textContent = "提交成绩后这里会显示你的名次"; return Promise.resolve(); }
    return sbReq("GET", SUPA.table + "?select=player_name,kills,survival_time&player_name=eq." +
                         encodeURIComponent(name) + "&limit=1")
      .then(function (res) {
        var row = (res.ok && Array.isArray(res.data)) ? res.data[0] : null;
        if (!row) { myRankEl.textContent = "提交成绩后这里会显示你的名次"; return; }
        return countBetter(row.survival_time, row.kills).then(function (r2) {
          var n = (r2.ok && Array.isArray(r2.data)) ? r2.data.length : null;
          myRankEl.innerHTML = "我（" + esc(row.player_name) + "）最好：<b>" + row.survival_time + "s</b> / <b>" +
                               row.kills + "杀</b>" + (n === null ? "" : "　第 <b>" + (n + 1) + "</b> 名");
        });
      });
  }

  /* ---------- 提交 ---------- */
  function submitScore() {
    var name = (pnameEl.value || "").trim().replace(/\s+/g, " ");
    if (!name) { setSubMsg("请输入用户名", "bad"); pnameEl.focus(); return; }
    if (name.length > 12) { setSubMsg("用户名最多 12 个字", "bad"); return; }
    var kills = Math.max(0, Math.round(GAME.kills));
    var surv = Math.max(0, Math.round(GAME.elapsed / 1000));
    rememberName(name);
    subBtn.disabled = true;
    setSubMsg("提交中…");
    sbReq("POST", "rpc/" + SUPA.rpc, { body: { p_name: name, p_kills: kills, p_survival: surv } })
      .then(function (res) {
        /* 后端函数还没建（PGRST202 / 404）时退回"查重 + 直接插入" */
        if (res.status === 404 || (res.data && res.data.code === "PGRST202")) return submitFallback(name, kills, surv);
        if (!res.ok) {
          subBtn.disabled = false;
          setSubMsg("提交失败：" + briefErr(res), "bad");
          return null;
        }
        if (res.data === null) {
          subBtn.disabled = false;
          setSubMsg("本次成绩不如你之前的，已保留原成绩", "bad");
          return boardLoad();
        }
        setSubMsg("已提交：" + surv + "s / " + kills + "杀", "ok");
        subBtn.disabled = false;
        return boardLoad();
      });
  }

  /* 兜底路径：不让插入（后端函数那套"更好才覆盖"用不了），只允许全新名字 */
  function submitFallback(name, kills, surv) {
    return sbReq("GET", SUPA.table + "?select=id&player_name=eq." + encodeURIComponent(name) + "&limit=1")
      .then(function (res) {
        if (!res.ok) { subBtn.disabled = false; setSubMsg("提交失败：" + briefErr(res), "bad"); return; }
        if (Array.isArray(res.data) && res.data.length) {
          subBtn.disabled = false;
          setSubMsg("这个名字已被使用，换一个吧", "bad");
          return;
        }
        return sbReq("POST", SUPA.table, {
          headers: { Prefer: "return=representation" },
          body: { player_name: name, kills: kills, survival_time: surv }
        }).then(function (r2) {
          subBtn.disabled = false;
          if (r2.ok) { setSubMsg("已提交：" + surv + "s / " + kills + "杀", "ok"); return boardLoad(); }
          var s = JSON.stringify(r2.data || "");
          if (r2.status === 409 || s.indexOf("23505") >= 0) setSubMsg("这个名字刚被抢了，换一个吧", "bad");
          else setSubMsg("提交失败：" + briefErr(r2), "bad");
        });
      });
  }

  window.__board = {                       // 便于脚本/控制台测试
    load: boardLoad, submit: submitScore, rank: refreshMyRank,
    rows: function () { return boardListEl ? boardListEl.textContent : ""; },
    state: function () { return { shown: !!(overEl && overEl.classList.contains("show")), msg: subMsgEl ? subMsgEl.textContent : "" }; }
  };

  requestAnimationFrame(frame);

  window.__game = {
    board: window.__board,                  // 排行榜接口（调试/测试用）
    state: function () { return GAME.state; },
    start: resetGame,
    stats: function () {
      return {
        state: GAME.state, elapsed: GAME.elapsed, sats: GAME.sats.length,
        types: GAME.sats.map(function (s) { return s.type; }),
        player: [Math.round(GAME.player.x), Math.round(GAME.player.y)],
        flip: GAME.player.flip, flipS: GAME.player.flipS, flipY: GAME.player.flipY, flipT: GAME.player.flipT,   // 朝向：1=朝左(原图), -1=朝右(镜像)
        bursts: bursts.length, particles: activeParticles, difficulty: difficulty(),
        kills: GAME.kills, gpts: GAME.sats.filter(function (s) { return s.type === "gpt"; }).length,
        playTime: GAME.playTime, deaths: GAME.deaths,
        isMobile: IS_MOBILE, autoCharge: GAME.autoCharge, touching: !!GAME.touch,
        playerR: GAME.player.r, flipWant: GAME.player.flipWant, flipT: GAME.player.flipT,
        shake: shakeAmp, mouseInside: mouse.inside, clickFrames: mouse.clickFrames,
        cursorSize: mouse.size || 0, cursorGlow: mouse.glow || 0
      };
    },
    spawn: function (type, x, y) {
      if (type === "gpt") spawnGpt(0);
      else if (type === "claude") { spawnClaude(0); var s = GAME.sats[GAME.sats.length - 1]; if (x !== undefined) { s.x = x; s.y = y; } }
      else { spawnClaude(0); var t = GAME.sats[GAME.sats.length - 1]; if (x !== undefined) { t.x = x; t.y = y; } }
      return GAME.sats[GAME.sats.length - 1];
    },
    sats: function () { return GAME.sats; },
    debug: function () {
      return { active: activeParticles, burstCount: bursts.length,
               lens: bursts.map(function (b) { return b.particles.length; }) };
    },
    movePlayer: function (x, y) { GAME.player.x = x; GAME.player.y = y; GAME.player.tx = x; GAME.player.ty = y; },
    explode: explodeAt
  };
})();

</script>
</body>
